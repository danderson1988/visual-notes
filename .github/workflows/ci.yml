name: CI

# Runs the same checks the release workflow does, but on every push and PR —
# so a typecheck, lint, or test failure surfaces before a tag is cut rather
# than while a release is being built.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          cache: "npm"

      # npm ci, not install: the lint is type-aware, so it needs obsidian's
      # type definitions present. Without them every value from the API is
      # error-typed and no-unsafe-call fires on essentially every line — which
      # is exactly the false result that rated this plugin risky.
      - name: Install dependencies
        run: npm ci

      # Runs both typechecks + lint + bundle. The second typecheck
      # (typecheck:upstream) compiles against the REAL installed packages
      # rather than the normalised copies in types/, and is what proves those
      # copies still mean what upstream wrote. It can only run where
      # dependencies are installed, which is why it lives here and not in the
      # health check's environment.
      - name: Build plugin
        run: npm run build

      - name: Run tests
        run: npm test

      # src/starter-templates.ts is generated from templates-src/ but committed,
      # because Obsidian's health check lints the repo without running
      # generators. The pre-hooks regenerate it on every build/test here, so
      # if templates-src/ changed and the regenerated output wasn't committed,
      # CI would silently test the fresh version while the checker (and users
      # reading the repo) see the stale one. Fail instead.
      - name: Committed generated files match their sources
        run: git diff --exit-code src/starter-templates.ts
